<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contract Fairness Analysis</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 40px; }
    .card { background: #fff; padding: 25px; border-radius: 10px; max-width: 700px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { margin-bottom: 10px; }
    .score { font-size: 48px; font-weight: bold; }
    .good { color: green; }
    .fair { color: orange; }
    .bad  { color: red; }
    label { font-weight: bold; }
    input { width: 100%; padding: 10px; margin: 8px 0 15px; font-size: 16px; }
    button { padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-right: 10px; }
    .result { background: #eef3fb; padding: 15px; border-radius: 8px; margin-top: 20px; }
    textarea { width: 100%; height: 180px; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>

<div class="card">
  <h1>Contract Fairness Analysis</h1>

  <div>
    Fairness Score: <span id="score" class="score good">100</span>/100
  </div>

  <br>

  <label>Contract Price ($)</label>
  <input type="number" id="contractPrice">

  <label>Fair Market Price ($)</label>
  <input type="number" id="marketPrice">

  <button onclick="calculateFairness()">Calculate Fairness</button>
  <button onclick="generateEmail()" id="generateEmailBtn" disabled>Generate Email</button>

  <div class="result" id="priceDetails" style="display:none;">
    <p><b>Contract Price:</b> $<span id="cp"></span></p>
    <p><b>Market Price:</b> $<span id="mp"></span></p>
    <p><b>Price Difference:</b> <span id="diff"></span>%</p>
    <p><b>Risk Amount:</b> $<span id="risk"></span></p>
  </div>

  <h3>Negotiation Email</h3>
  <textarea id="emailText" readonly></textarea>
</div>

<script>
let state = {};

function calculateFairness() {
  const cp = Number(contractPrice.value);
  const mp = Number(marketPrice.value);

  if (cp <= 0 || mp <= 0) {
    alert("Prices must be greater than zero.");
    return;
  }

  const diffPercent = ((cp - mp) / mp) * 100;

  // Fairness logic (capped)
  let score = 100 - Math.abs(diffPercent);
  score = Math.max(0, Math.min(100, Math.round(score)));

  state = { cp, mp, diffPercent, score };

  // Update UI
  scoreEl(score);
  cpEl.innerText = cp.toFixed(2);
  mpEl.innerText = mp.toFixed(2);
  diffEl.innerText = diffPercent.toFixed(2);
  riskEl.innerText = (cp - mp).toFixed(2);

  priceDetails.style.display = "block";
  generateEmailBtn.disabled = false;
  emailText.value = "";
}

function scoreEl(score) {
  const el = document.getElementById("score");
  el.innerText = score;
  el.className = "score";
  el.classList.add(score >= 80 ? "good" : score >= 50 ? "fair" : "bad");
}

function generateEmail() {
  const { cp, mp, diffPercent, score } = state;
  let email = "Subject: Contract Pricing Review\n\nHello,\n\n";

  if (diffPercent === 0) {
    email += `The contract price of $${cp.toFixed(2)} exactly matches the current market price. `
           + `This confirms that the agreement is fair and well-aligned with market standards.\n\nThank you.`;
  }
  else if (diffPercent > 0 && diffPercent <= 10) {
    email += `The contract price of $${cp.toFixed(2)} is slightly higher than the market price of $${mp.toFixed(2)} `
           + `(${diffPercent.toFixed(2)}% difference). While the deal is generally acceptable, `
           + `a minor adjustment could improve alignment with fair market value.\n\nThank you.`;
  }
  else if (diffPercent > 10) {
    email += `Upon review, the contract price of $${cp.toFixed(2)} exceeds the market price of $${mp.toFixed(2)} `
           + `by ${diffPercent.toFixed(2)}%, indicating a potential overpayment of $${(cp - mp).toFixed(2)}. `
           + `I recommend revisiting the pricing to reduce financial risk and ensure fairness.\n\nThank you.`;
  }
  else {
    email += `The contract price of $${cp.toFixed(2)} is significantly lower than the market price of $${mp.toFixed(2)} `
           + `(${Math.abs(diffPercent).toFixed(2)}% below market). While this may seem favorable, `
           + `it is advisable to verify the scope and terms to avoid hidden risks.\n\nThank you.`;
  }

  emailText.value = email;
}

// Shortcuts
const cpEl = document.getElementById("cp");
const mpEl = document.getElementById("mp");
const diffEl = document.getElementById("diff");
const riskEl = document.getElementById("risk");
</script>

</body>
</html>
