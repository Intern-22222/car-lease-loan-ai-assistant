<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fairness Score</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }

    .card {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 10px;
    }

    .score {
      font-size: 48px;
      font-weight: bold;
      color: green;
    }

    .bad {
      color: red;
    }

    .prices {
      margin-top: 20px;
    }

    .prices div {
      margin: 6px 0;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 15px;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Contract Fairness Analysis</h2>

    <div>
      Fairness Score:
      <span class="score" id="score">45</span>/100
    </div>

    <div class="prices">
      <div><b>Contract Price:</b> $27,148</div>
      <div><b>Fair Market Price:</b> $23,000</div>
      <div><b>Overpayment Risk:</b> $4,148</div>
    </div>

    <h3>Negotiation Email</h3>
    <textarea id="emailText" readonly></textarea>

    <button onclick="generateEmail()">Generate Email</button>
  </div>

  <script>
    function generateEmail() {
      document.getElementById("emailText").value =
`Subject: Request for Revised Buyer’s Order

Hello,

After reviewing the contract, I noticed the price exceeds the fair market value.
Additionally, optional add-ons like Nitrogen Fill and VIN Etching were included.

Please remove these charges and share a revised buyer’s order.

Thank you,
Customer`;
    }
  </script>

</body>
</html>
