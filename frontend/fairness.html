<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contract Fairness Score</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      max-width: 650px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
    }

    .score {
      font-size: 48px;
      font-weight: bold;
    }

    .good {
      color: green;
    }

    .bad {
      color: red;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      background: #eef3ff;
      padding: 12px;
      border-radius: 6px;
    }

    textarea {
      width: 100%;
      height: 140px;
      margin-top: 15px;
      padding: 10px;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Contract Fairness Analysis</h2>

  <div>
    Fairness Score:
    <span class="score" id="score">--</span>/100
  </div>

  <label>Contract Price ($)</label>
  <input type="number" id="contractPrice" placeholder="Enter contract price">

  <label>Fair Market Price ($)</label>
  <input type="number" id="marketPrice" placeholder="Enter market price">

  <button onclick="calculateFairness()">Calculate Fairness</button>

  <div class="result" id="priceResult"></div>

  <h3>Negotiation Email</h3>

  <textarea id="emailText" readonly placeholder="Click 'Generate Email' after calculation"></textarea>

  <button onclick="generateEmail()">Generate Email</button>

</div>

<script>
let emailContent = "";

function calculateFairness() {
  const contract = Number(document.getElementById("contractPrice").value);
  const market = Number(document.getElementById("marketPrice").value);

  if (!contract || !market) {
    alert("Please enter both contract and market prices.");
    return;
  }

  const difference = contract - market;
  const percent = (difference / market) * 100;
  let score = Math.max(100 - percent, 0).toFixed(0);

  const scoreSpan = document.getElementById("score");
  scoreSpan.innerText = score;

  scoreSpan.className = "score " + (score >= 70 ? "good" : "bad");

  document.getElementById("priceResult").innerHTML = `
    <b>Contract Price:</b> $${contract}<br>
    <b>Market Price:</b> $${market}<br>
    <b>Overpayment Risk:</b> $${difference}<br>
    <b>Difference:</b> ${percent.toFixed(2)}%
  `;

  emailContent =
`Subject: Request for Revised Buyer’s Order

Hello,

After reviewing the contract, I noticed that the price is approximately ${percent.toFixed(2)}% higher than the fair market value.

This indicates a potential overpayment, and I request a revised quotation aligned with current market pricing.

Please also remove any optional add-ons that were not explicitly requested.

Thank you,
Customer`;
}

function generateEmail() {
  if (!emailContent) {
    alert("Please calculate fairness first.");
    return;
  }
  document.getElementById("emailText").value = emailContent;
}
</script>

</body>
</html>
